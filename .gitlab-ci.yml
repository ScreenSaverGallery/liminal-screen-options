stages:
  - build
  - deploy
  - release

variables:
  ANGULAR_IMAGE: node:24

build_app:
  stage: build
  image: $ANGULAR_IMAGE
  before_script:
    - mkdir -p src/environments
    - echo "$ENVIRONMENT_PROD_TS" | sed 's/\\n/\n/g' > src/environments/environment.ts
    - cat src/environments/environment.ts
    - |
      echo 'export const environment = { production: false };' > src/environments/environment.development.ts
    - npm ci
  script:
    - npx ng build --configuration=production
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  only:
    - tags

deploy:
  stage: release
  image: debian:bullseye
  needs:
    - job: build_app
      artifacts: true
  before_script:
    - apt update && apt install -y openssh-client
    - mkdir -p ~/.ssh
    - cp "$CANIS_DEPLOY_KEY" ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - echo "$CANIS_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - |
      if [ ! -f "$CANIS_DEPLOY_KEY" ]; then
        echo "ERROR: CANIS_DEPLOY_KEY does not point to a file" >&2
        echo "Make sure the GitLab variable is set to 'File' type, not 'Variable'" >&2
        exit 1
      fi
    - |
      if ! grep -q "BEGIN OPENSSH PRIVATE KEY" "$CANIS_DEPLOY_KEY"; then
        echo "ERROR: CANIS_DEPLOY_KEY does not contain a valid OpenSSH private key" >&2
        exit 1
      fi
  script:
    - scp -r dist/* "$CANIS_DEPLOY_USER@$CANIS_DEPLOY_HOST:$CANIS_OPTIONS_DEPLOY_PATH"
  only:
    - tags
